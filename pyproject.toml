[project]
name = "warpmpm"
version = "0.0.1"
license = {text = "MIT"}
description = "FORM: material identification and model-based deformable manipulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "warp-lang>=1.10.1,<2",
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "ty"]
mujoco = ["mujoco>=3.1", "robot_descriptions>=1.10"]
render = ["matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.4.9", "pillow>=10.0"]
surface = ["scipy>=1.11", "scikit-image>=0.22", "pyvista>=0.43"]
geometry = ["scipy>=1.11", "trimesh>=4.0"]
ident = ["scipy>=1.11", "osqp>=0.6", "matplotlib>=3.8"]
io = ["h5py>=3.10"]
paper = ["warpmpm[mujoco,render,surface,geometry,ident,io]", "opencv-python-headless==4.11.0.86", "pyyaml>=6", "shapely==2.1.2", "pymeshfix>=0.17"]
all = ["warpmpm[paper,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warpmpm", "src/ident", "src/common"]

[project.scripts]
warpmpm-prewarm = "warpmpm.prewarm:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks", "examples", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E402", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"src/warpmpm/kernels/__init__.py" = ["F401"]
"src/warpmpm/kernels/*.py" = ["E", "I", "UP", "SIM", "B", "RUF", "F401", "F403", "F405", "F841"]
"src/ident/**/*.py" = ["E", "I", "UP", "SIM", "B", "RUF"]
"src/common/**/*.py" = ["E", "I", "UP", "SIM", "B", "RUF"]
"experiments/robotics/*.py" = ["E", "I", "UP", "SIM", "B", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: multi-second physics/benchmark tests"]
